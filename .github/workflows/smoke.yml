name: Gateway smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, harvester-runners]
    permissions:
      contents: read
      id-token: write
    env:
      GATEWAY_SMOKE: "1"
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}
      GATEWAY_IMAGE: ${{ vars.GATEWAY_IMAGE }}
      GATEWAY_NETWORK: ${{ vars.GATEWAY_NETWORK }}
      GATEWAY_AUDIENCE: ${{ vars.GATEWAY_AUDIENCE }}
      GATEWAY_CA_CERT: ${{ vars.GATEWAY_CA_CERT }}
      GATEWAY_SMOKE_CONCURRENCY: ${{ vars.GATEWAY_SMOKE_CONCURRENCY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build gateway and smoke clients
        run: make build
      - name: Exercise concurrent VM and volume lifecycles
        run: ./scripts/smoke.sh
