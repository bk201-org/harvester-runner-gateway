name: Gateway client example
on: workflow_dispatch

jobs:
  vm:
    runs-on: harvester-runners
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build gateway client
        run: go build -o bin/hvst-runner-gw-client ./cmd/hvst-runner-gw-client
      - name: Create and inspect VM
        env:
          GATEWAY_URL: https://gateway.example.internal:8443
          GATEWAY_AUDIENCE: api://harvester-runner-gateway
          # For a private CA, set GATEWAY_CA_CERT to a PEM file on the runner.
        shell: bash
        run: |
          set -euo pipefail
          client=./bin/hvst-runner-gw-client
          vm=$("$client" vm create \
            --image default/ubuntu-24-04 --network default/vm-network \
            --cpu 2 --memory 4Gi --boot-disk-size 20Gi \
            --idempotency-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-vm")
          vm_id=$(printf '%s' "$vm" | \
            jq -er 'select(.ready == true and (.ipAddresses | length > 0)) | .id')
          trap '"$client" vm delete "$vm_id" || true' EXIT
          "$client" vm get "$vm_id" | jq .
