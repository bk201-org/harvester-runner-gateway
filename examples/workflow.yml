name: Gateway client example
on: workflow_dispatch

jobs:
  vm:
    runs-on: harvester-runners
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build gateway client
        run: go build -o bin/hvst-runner-gw-client ./cmd/hvst-runner-gw-client
      - name: Create and inspect VM
        env:
          GATEWAY_URL: https://gateway.example.internal:8443
          GATEWAY_AUDIENCE: api://harvester-runner-gateway
          # For a private CA, set GATEWAY_CA_CERT to a PEM file on the runner.
        shell: bash
        run: |
          set -euo pipefail
          client=./bin/hvst-runner-gw-client
          vm=$("$client" vm create \
            --image default/ubuntu-24-04 --network default/vm-network \
            --cpu 2 --memory 4Gi --boot-disk-size 20Gi --no-wait)
          vm_id=$(printf '%s' "$vm" | jq -er '.id')
          trap '"$client" vm delete "$vm_id" || true' EXIT
          for _ in $(seq 1 30); do
            status=$("$client" vm get "$vm_id")
            if printf '%s' "$status" | jq -e '.ready == true and (.ipAddresses | length > 0)' >/dev/null; then
              printf '%s\n' "$status" | jq .
              exit 0
            fi
            sleep 10
          done
          echo "VM did not become ready" >&2
          exit 1
