name: CI RKE2 cluster
on: workflow_dispatch

jobs:
  cluster:
    runs-on: [self-hosted, harvester-runners]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Create RKE2 cluster
        id: cluster
        uses: OWNER/REPO/actions/create-rke2-cluster@VERSION
        with:
          gateway-url: https://gateway.example.internal:8443
          vm-count: '3'
          image: default/ubuntu-24-04
          network: default/vm-network
          cpu: '2'
          memory: 8Gi
          boot-disk-size: 40Gi
          username: ubuntu
          rke2-version: v1.35.2+rke2r1
          binary-url: https://github.com/OWNER/REPO/releases/download/VERSION/hvst-runner-gw-client-linux-amd64
          binary-sha256: REPLACE_WITH_SHA256_FROM_SHA256SUMS
          # Optional pull-through caches for the cluster images:
          # registry-mirrors: |
          #   - registry: docker.io
          #     endpoint: http://10.0.10.1:5000
      - name: Show nodes
        env:
          KUBECONFIG: ${{ steps.cluster.outputs.kubeconfig-path }}
        shell: bash
        run: kubectl get nodes -o wide
